[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "llmfy"
dynamic = ["version"]
description = "`LLMfy` is a framework for developing applications with large language models (LLMs)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "irufano", email = "irufano.official@gmail.com" },
]
keywords = [
    "llm",
    "ai",
    "llm-framework",
    "llm-abstraction",
    "bedrock",
    "openai",
    "google",
    "anthropic",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/llmfy-labs/llmfy-python"
Repository = "https://github.com/llmfy-labs/llmfy-python"
Issues = "https://github.com/llmfy-labs/llmfy-python/issues"

[project.optional-dependencies]
openai = ["openai"]
boto3 = ["boto3"]
aioboto3 = ["aioboto3"]
google-genai = ["google-genai"]
anthropic = ["anthropic"]
numpy = ["numpy"]
typing_extensions = ["typing_extensions"]
redis = ["redis"]
SQLAlchemy = ["SQLAlchemy"]
crypto = ["cryptography"]
all = [
    "openai",
    "boto3",
    "aioboto3",
    "google-genai",
    "anthropic",
    "numpy",
    "typing_extensions",
    "redis",
    "SQLAlchemy",
    "cryptography",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.1.0",
    "openai>=2.52.0",
    "boto3",
    "aioboto3>=15.5.0",
    "google-genai>=2.16.0",
    "anthropic>=0.120.0",
    "numpy>=2.3.3",
    "redis>=7.1.0",
    "SQLAlchemy>=2.0.44",
    "typing_extensions>=4.15.0",
    "PyMySQL>=1.1.2",
    "cryptography>=42.0.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-get-deps>=0.2.0",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
    "mkdocs-material>=9.6.20",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-material[imaging]",
    "watchdog>=6.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"

[tool.hatch.build.hooks.vcs]
version-file = "llmfy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["llmfy"]
exclude = ["llmfy/test/"]

[tool.hatch.build.targets.sdist]
include = [
    "llmfy/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["llmfy/test/"]

[tool.ruff]
target-version = "py311"
exclude = ["llmfy/_version.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["llmfy"]
